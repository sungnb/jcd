<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#f3f6fa">
<title>전시대 신청</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 20px 14px 40px;
    background: #f3f6fa;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    color: #202124;
}

.container {
    max-width: 520px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 27px;
    font-weight: 800;
}

.header p {
    margin: 7px 0 0;
    color: #68707d;
    font-size: 14px;
}

/* 카드 */
.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

.card-title {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 13px;
}

/* 인원 버튼 */
.people-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.people-btn {
    border: 0;
    border-radius: 13px;
    background: #edf1f5;
    color: #333;
    padding: 15px 5px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
}

.people-btn.active {
    background: #2864e8;
    color: white;
}

/* 시간 */
.time-row {
    display: flex;
    gap: 10px;
    align-items: center;
}

input[type="time"] {
    width: 100%;
    padding: 14px;
    border: 1px solid #d9dee7;
    border-radius: 12px;
    font-size: 18px;
    background: #fff;
}

/* 이름 */
.name-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.name-row {
    display: flex;
    align-items: center;
    gap: 9px;
}

.number {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    background: #edf1f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #555;
}

.name-input {
    width: 100%;
    border: 1px solid #d9dee7;
    border-radius: 11px;
    padding: 12px 13px;
    font-size: 16px;
    outline: none;
}

.name-input:focus {
    border-color: #2864e8;
}

/* 생성 버튼 */
.create-btn {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 16px;
    background: #111827;
    color: white;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
}

/* 결과 */
.result {
    display: none;
}

.result-title {
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 5px;
}

.result-sub {
    text-align: center;
    color: #697386;
    font-size: 14px;
    margin-bottom: 15px;
}

.schedule {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.schedule-item {
    border: 1px solid #e3e7ed;
    border-radius: 13px;
    padding: 13px;
    background: #fafbfc;
}

.schedule-time {
    font-size: 14px;
    color: #2864e8;
    font-weight: 800;
    margin-bottom: 5px;
}

.schedule-names {
    font-size: 17px;
    font-weight: 800;
}

/* 공유 */
.share-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 15px;
}

.share-btn {
    border: 0;
    border-radius: 13px;
    padding: 14px 8px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
}

.kakao {
    background: #fee500;
    color: #191919;
}

.copy {
    background: #edf1f5;
    color: #333;
}

.notice {
    margin-top: 12px;
    padding: 12px;
    background: #f5f7fa;
    border-radius: 11px;
    color: #697386;
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>전시대 신청</h1>
        <p>인원수와 시작 시간을 선택해 주세요</p>
    </div>

    <!-- 인원 선택 -->
    <div class="card">

        <div class="card-title">① 신청 인원</div>

        <div class="people-buttons">

            <button class="people-btn"
                    onclick="selectPeople(5)">
                5명
            </button>

            <button class="people-btn"
                    onclick="selectPeople(6)">
                6명
            </button>

            <button class="people-btn"
                    onclick="selectPeople(7)">
                7명
            </button>

        </div>

    </div>


    <!-- 시작 시간 -->
    <div class="card">

        <div class="card-title">② 시작 시간</div>

        <div class="time-row">
            <input type="time"
                   id="startTime"
                   value="10:00"
                   onchange="updateEndInfo()">
        </div>

        <div class="notice" id="timeInfo">
            인원을 먼저 선택해 주세요.
        </div>

    </div>


    <!-- 이름 -->
    <div class="card hidden" id="nameCard">

        <div class="card-title">
            ③ 이름을 순서대로 입력해 주세요
        </div>

        <div class="name-list" id="nameList"></div>

    </div>


    <!-- 생성 -->
    <div class="card hidden" id="createCard">

        <button class="create-btn"
                onclick="makeSchedule()">
            전시대 시간표 만들기
        </button>

    </div>


    <!-- 결과 -->
    <div class="card result" id="result">

        <div class="result-title">
            전시대 교대 시간표
        </div>

        <div class="result-sub" id="resultInfo"></div>

        <div class="schedule"
             id="schedule"></div>


        <div class="share-buttons">

            <button class="share-btn kakao"
                    onclick="shareKakao()">
                💬 카카오톡 공유
            </button>

            <button class="share-btn copy"
                    onclick="copySchedule()">
                📋 내용 복사
            </button>

        </div>

        <div class="notice">
            카카오톡 공유가 지원되지 않는 환경에서는
            '내용 복사' 후 카카오톡에 붙여넣어 주세요.
        </div>

    </div>

</div>


<script>

let peopleCount = 0;


/* 인원 선택 */
function selectPeople(count) {

    peopleCount = count;

    document.querySelectorAll(".people-btn")
        .forEach(btn => btn.classList.remove("active"));

    event.currentTarget.classList.add("active");

    createNameInputs();

    updateEndInfo();

    document.getElementById("nameCard")
        .classList.remove("hidden");

    document.getElementById("createCard")
        .classList.remove("hidden");

    document.getElementById("result")
        .style.display = "none";
}


/* 이름 입력칸 생성 */
function createNameInputs() {

    const list = document.getElementById("nameList");

    list.innerHTML = "";

    for (let i = 1; i <= peopleCount; i++) {

        const row = document.createElement("div");

        row.className = "name-row";

        row.innerHTML = `
            <div class="number">${i}</div>
            <input
                class="name-input"
                type="text"
                placeholder="${i}번 이름"
                maxlength="20">
        `;

        list.appendChild(row);
    }
}


/* 종료시간 정보 */
function updateEndInfo() {

    if (!peopleCount) return;

    const start =
        document.getElementById("startTime").value;

    if (!start) return;

    let [hour, minute] =
        start.split(":").map(Number);

    let interval;
    let totalMinutes;

    if (peopleCount === 5) {

        interval = 12;
        totalMinutes = 60;

    } else if (peopleCount === 6) {

        interval = 10;
        totalMinutes = 60;

    } else if (peopleCount === 7) {

        interval = 10;
        totalMinutes = 70;

    }

    let endTotal =
        hour * 60 + minute + totalMinutes;

    let endHour =
        Math.floor(endTotal / 60) % 24;

    let endMinute =
        endTotal % 60;

    const end =
        String(endHour).padStart(2, "0")
        + ":" +
        String(endMinute).padStart(2, "0");

    document.getElementById("timeInfo").innerHTML =
        `${start}부터 ${end}까지 운영<br>
         ${peopleCount}명 · ${interval}분 간격`;
}


/* 시간 표시 */
function formatTime(totalMinutes) {

    totalMinutes =
        ((totalMinutes % 1440) + 1440) % 1440;

    let hour =
        Math.floor(totalMinutes / 60);

    let minute =
        totalMinutes % 60;

    const ampm =
        hour < 12 ? "오전" : "오후";

    let displayHour =
        hour % 12;

    if (displayHour === 0)
        displayHour = 12;

    return `${ampm} ${displayHour}:${String(minute).padStart(2,"0")}`;
}


/* 시간표 생성 */
function makeSchedule() {

    if (!peopleCount) {
        alert("먼저 인원을 선택해 주세요.");
        return;
    }

    const inputs =
        document.querySelectorAll(".name-input");

    const names =
        Array.from(inputs)
        .map(input => input.value.trim());

    for (let i = 0; i < names.length; i++) {

        if (!names[i]) {

            alert(`${i + 1}번 이름을 입력해 주세요.`);

            inputs[i].focus();

            return;
        }
    }


    const startValue =
        document.getElementById("startTime").value;

    let [hour, minute] =
        startValue.split(":").map(Number);

    let startMinutes =
        hour * 60 + minute;


    let interval =
        peopleCount === 5 ? 12 : 10;

    let totalMinutes =
        peopleCount === 7 ? 70 : 60;


    const schedule =
        document.getElementById("schedule");

    schedule.innerHTML = "";


    for (let i = 0; i < peopleCount; i++) {

        const from =
            startMinutes + i * interval;

        const to =
            from + interval;


        const name1 =
            names[i];

        const name2 =
            names[(i + 1) % peopleCount];


        const item =
            document.createElement("div");

        item.className =
            "schedule-item";

        item.innerHTML = `
            <div class="schedule-time">
                ${formatTime(from)} ~ ${formatTime(to)}
            </div>

            <div class="schedule-names">
                ${name1} + ${name2}
            </div>
        `;

        schedule.appendChild(item);
    }


    const end =
        startMinutes + totalMinutes;

    document.getElementById("resultInfo").innerText =
        `${peopleCount}명 · ${formatTime(startMinutes)} 시작 ·
         ${formatTime(end)} 종료`;


    document.getElementById("result")
        .style.display = "block";


    setTimeout(() => {

        document.getElementById("result")
            .scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

    }, 100);
}


/* 공유용 텍스트 */
function getShareText() {

    const info =
        document.getElementById("resultInfo").innerText;

    const items =
        document.querySelectorAll(".schedule-item");

    let text =
        "📋 전시대 신청 시간표\n\n";

    text += info + "\n\n";

    items.forEach((item, index) => {

        const time =
            item.querySelector(".schedule-time")
                .innerText;

        const names =
            item.querySelector(".schedule-names")
                .innerText;

        text +=
            `${index + 1}. ${time}\n` +
            `   ${names}\n\n`;
    });

    return text;
}


/* 카카오톡 공유 */
async function shareKakao() {

    const text = getShareText();

    /*
       모바일의 기본 공유 기능을 사용합니다.
       카카오톡이 설치되어 있으면
       공유 대상에서 카카오톡을 선택할 수 있습니다.
    */

    if (navigator.share) {

        try {

            await navigator.share({
                title: "전시대 신청 시간표",
                text: text
            });

        } catch (error) {

            console.log("공유 취소");

        }

    } else {

        await copySchedule();

        alert(
            "공유 기능을 지원하지 않는 환경입니다.\n\n" +
            "시간표가 복사되었습니다.\n" +
            "카카오톡에 붙여넣어 주세요."
        );
    }
}


/* 복사 */
async function copySchedule() {

    const text = getShareText();

    try {

        await navigator.clipboard.writeText(text);

        alert("전시대 시간표가 복사되었습니다.");

    } catch (error) {

        const textarea =
            document.createElement("textarea");

        textarea.value = text;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        alert("전시대 시간표가 복사되었습니다.");
    }
}

</script>

</body>
</html>
